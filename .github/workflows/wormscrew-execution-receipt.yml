name: Wormscrew Execution Receipt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "constitutional_vm_audit/**"
      - ".github/workflows/wormscrew-execution-receipt.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execution-receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact triggering commit
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify repository state
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --porcelain
          git diff --stat
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "FAIL-CLOSED: worktree is dirty." >&2
            exit 1
          fi

      - name: Install stable Rust
        # dtolnay/rust-toolchain stable channel action snapshot
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - name: Verify Rust and Cargo versions
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustc -vV
          cargo --version

          cargo_version="$(cargo --version | awk '{print $2}')"
          minimum_version="1.85.0"
          if [[ "$(printf '%s\n%s\n' "${minimum_version}" "${cargo_version}" | sort -V | head -n1)" != "${minimum_version}" ]]; then
            echo "Cargo ${cargo_version} is below required ${minimum_version}." >&2
            exit 1
          fi

      - name: Collect execution receipt
        id: collector
        shell: bash
        run: |
          set +e
          RECEIPT_ROOT="${RUNNER_TEMP}/pr6_evidence" \
          bash constitutional_vm_audit/scripts/collect_execution_receipt.sh
          collector_exit_code=$?
          set -e
          echo "exit_code=${collector_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload untouched execution evidence
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: constitutional-vm-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pr6_evidence
          if-no-files-found: warn
          include-hidden-files: true

      - name: Enforce collector exit code
        if: always()
        shell: bash
        env:
          COLLECTOR_EXIT_CODE: ${{ steps.collector.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ -z "${COLLECTOR_EXIT_CODE}" ]]; then
            echo "Collector did not report an exit code." >&2
            exit 1
          fi
          if [[ "${COLLECTOR_EXIT_CODE}" -ne 0 ]]; then
            echo "Collector exited with code ${COLLECTOR_EXIT_CODE}." >&2
            exit "${COLLECTOR_EXIT_CODE}"
          fi
